<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Marble Strategy Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1 class="game-title">Marble<span class="accent">Shift</span></h1>
            <p class="tagline">4×4 Kinetic Strategy Game with Revolving Perimeter Mechanics</p>
        </header>

        <div class="scoreboard">
            <div class="player-pill p1-pill">
                <span class="pill-dot dot-p1"></span>
                <span class="player-name">Player 1</span>
                <span class="score" id="p1-score">0</span>
            </div>
            <div class="vs">VS</div>
            <div class="player-pill p2-pill">
                <span class="pill-dot dot-p2"></span>
                <span class="player-name">Player 2</span>
                <span class="score" id="p2-score">0</span>
            </div>
        </div>

        <div class="status-container">
            <div id="status" class="status player1-turn">Player 1's Turn</div>
        </div>

        <div class="board-frame">
            <div class="rotation-indicator" title="Outer ring shifts counter-clockwise after every move">
                <span class="arrow-symbol">↺</span> Outer Ring Rotates Each Turn
            </div>
            <div class="grid-container" id="board">
                <!-- 4x4 grid cells generated via style.js -->
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">New Match</button>
    </div>

    <script src="style.js"></script>
</body>
</html>
